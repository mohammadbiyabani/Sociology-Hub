<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Outer societal network circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>
  
  <!-- Network Nodes representing society -->
  <g stroke="#38bdf8" stroke-width="2.5" opacity="0.6">
    <line x1="256" y1="110" x2="160" y2="170" />
    <line x1="256" y1="110" x2="352" y2="170" />
    <line x1="160" y1="170" x2="140" y2="280" />
    <line x1="352" y1="170" x2="372" y2="280" />
    <line x1="140" y1="280" x2="256" y2="380" />
    <line x1="372" y1="280" x2="256" y2="380" />
    <line x1="256" y1="200" x2="256" y2="280" />
    <line x1="160" y1="170" x2="256" y2="200" />
    <line x1="352" y1="170" x2="256" y2="200" />
    <line x1="140" y1="280" x2="256" y2="280" />
    <line x1="372" y1="280" x2="256" y2="280" />
  </g>

  <!-- Node dots -->
  <circle cx="256" cy="110" r="10" fill="#38bdf8" />
  <circle cx="160" cy="170" r="9" fill="#818cf8" />
  <circle cx="352" cy="170" r="9" fill="#818cf8" />
  <circle cx="140" cy="280" r="9" fill="#c084fc" />
  <circle cx="372" cy="280" r="9" fill="#c084fc" />
  <circle cx="256" cy="200" r="12" fill="url(#goldGrad)" />
  <circle cx="256" cy="280" r="11" fill="url(#goldGrad)" />
  <circle cx="256" cy="380" r="10" fill="#38bdf8" />

  <!-- Open Academic Book Icon in foreground -->
  <g transform="translate(156, 260)">
    <!-- Left Page -->
    <path d="M 100 80 C 60 70 20 74 0 85 L 0 135 C 20 124 60 120 100 130 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Right Page -->
    <path d="M 100 80 C 140 70 180 74 200 85 L 200 135 C 180 124 140 120 100 130 Z" fill="#f1f5f9" opacity="0.9"/>
    <!-- Spine bookmark -->
    <path d="M 97 75 L 103 75 L 103 125 L 100 120 L 97 125 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Multilingual glyphs subtle indicator: Eng, Hin, Tel -->
  <text x="256" y="445" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="600" letter-spacing="3">MA SOCIOLOGY</text>
</svg>
